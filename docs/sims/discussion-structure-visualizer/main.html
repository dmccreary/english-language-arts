<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="schema" content="https://dmccreary.github.io/intelligent-textbooks/ns/microsim/v1">
    <title>Interactive Academic Discussion Protocol Map using vis-network</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/styles/vis-network.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
    <script src="discussion-structure-visualizer.js"></script>
</head>
<body>
    <main>
        <div class="sim">
            <!-- title and mode switch -->
            <div class="topbar">
                <h1 class="title">Academic Discussion Protocol Map</h1>
                <div class="modes" role="group" aria-label="Mode">
                    <button id="explore-mode-btn" class="mode-btn active" aria-pressed="true">Explore</button>
                    <button id="role-mode-btn" class="mode-btn" aria-pressed="false">Role Play</button>
                </div>
            </div>

            <!-- Explore mode: network on the left, detail / comparison panel on the right -->
            <div id="explore-view" class="view">
                <div class="network-wrap">
                    <div id="network" aria-label="Network of four discussion protocols and their attributes"></div>
                    <div class="hint" id="network-hint">Click a protocol or one of its attributes</div>
                </div>
                <aside class="panel" id="panel" aria-live="polite"></aside>
            </div>

            <!-- Role Play mode: pick a protocol and a role, get a preparation card -->
            <div id="role-view" class="view" hidden>
                <div class="role-controls">
                    <label for="protocol-select">Protocol:</label>
                    <select id="protocol-select"></select>
                    <label for="role-select">Your role:</label>
                    <select id="role-select"></select>
                </div>
                <div class="role-card" id="role-card" aria-live="polite"></div>
            </div>
        </div>
    </main>
    <br/>
    <a href=".">Back to Lesson Plan</a>
</body>
</html>
